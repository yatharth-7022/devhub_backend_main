services:
  - type: web
    name: devhub-backend
    runtime: docker
    rootDir: devhub-backend
    dockerfilePath: ./Dockerfile
    plan: starter # Chromium needs >= 1 GB RAM
    healthCheckPath: /health
    branch: development
    envVars:
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false # Neon pooled connection string
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_CHAT_MODEL
        value: gpt-4o-mini
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: FRONTEND_ORIGIN
        sync: false # e.g. https://your-app.vercel.app
